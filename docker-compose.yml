services:
  app:
    build:
      context: ./app/
    ports:
      - "8000:8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
    networks:
      - app-network 
    volumes:
      - ./app:/app

  web:
    build:
      context: ./web/
    ports:
      - "80:80"
    volumes:
      - ./web:/web
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - app-network
networks:
  app-network:
    driver: bridge  
