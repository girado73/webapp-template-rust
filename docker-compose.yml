services:
  app:
    build:
      context: ./app/
    ports:
      - "8000:8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
    volumes:
      - ./app:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    networks:
      - app-network 

  web:
    build:
      context: ./web/
    ports:
      - "80:80"
    volumes:
      - ./web:/web
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - app-network
networks:
  app-network:
    driver: bridge  

volumes:
  cargo_cache:
  target_cache:
